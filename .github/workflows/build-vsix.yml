# Build a downloadable .vsix for every pull request (and on demand).
# Testers: open the workflow run → Artifacts → download the .vsix →
# Extensions → ⋯ → Install from VSIX…

name: Build VSIX

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: build-vsix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VSIX
        run: pnpm run vsix

      - name: Rename VSIX for PR
        id: vsix
        run: |
          src=$(ls -1 ./*.vsix | head -1)
          if [ -z "$src" ]; then
            echo "::error::No .vsix produced"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            dest="bc-xlf-editor-${version}-pr-${{ github.event.pull_request.number }}.vsix"
          else
            dest="bc-xlf-editor-${version}-${GITHUB_SHA::7}.vsix"
          fi
          mv "$src" "$dest"
          echo "file=$dest" >> "$GITHUB_OUTPUT"
          echo "Built $dest ($(du -h "$dest" | cut -f1))"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.file }}
          path: ${{ steps.vsix.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifact = '${{ steps.vsix.outputs.file }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Preview build ready',
              '',
              `Download **\`${artifact}\`** from the Artifacts section of this [workflow run](${runUrl}).`,
              '',
              'Install in VS Code / Cursor: **Extensions** → **⋯** → **Install from VSIX…**',
              '',
              '_This comment is updated on each push to the PR._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const marker = '### Preview build ready';
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
